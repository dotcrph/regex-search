<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
    </head>
    <body>
        <span id="selection" style="display: inline-block; text-align: right" title="Current selection"></span>
        <span id="matchCounter" style="display: inline-block; text-align: right" title="Matches highlighted"></span>
        <span id="asterisk" style="color: grey" title="You have changed the regex since the last highlight">⁎</span>
        <input id="regexField" type="text" value="" placeholder="regex"/>
        <!-- <input id="flagField" type="text" value="" placeholder="flags" style="display: inline-block; max-width: 3.5em"/> -->
        <button id="bQuicksearch" title="Clear old matches and highlight new">🔎</button>
        <button id="bHighlight" title="Highlight all matches">👁️</button>
        <button id="bClear" title="Clear all matches">🚫</button>
        <button id="bNext" title="Select next match">▼</button>
        <button id="bPrev" title="Select previous match">▲</button>
    </body>
    <script src="popup.js"></script>
</html>
